name: Build and Push Streamlit Docker Image

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'additional codes/streamlit_app_dockerfile'
      - 'additional codes/streamlit_app.py'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./additional codes/streamlit_app_dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/packman-streamlit:latest
            ${{ secrets.DOCKER_USERNAME }}/packman-streamlit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
